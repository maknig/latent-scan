[workspace]
resolver = "2"
members = [
    "crates/latent-scan-core",
    "crates/latent-scan-sane",
    "crates/latent-scan-profiles",
    "crates/latent-scan-archive",
    "crates/latent-scan-detect",
    "crates/latent-scan-ui",
    "apps/latent-scan-cli",
    "apps/latent-scan-gui",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg"] }
tempfile = "3"
egui = "0.31"
eframe = "0.31"

latent-scan-core = { path = "crates/latent-scan-core" }
latent-scan-sane = { path = "crates/latent-scan-sane" }
latent-scan-profiles = { path = "crates/latent-scan-profiles" }
latent-image-edit = { git = "https://github.com/maknig/latent", branch = "image-edit-view" }
latent-image-edit-ui = { git = "https://github.com/maknig/latent", branch = "image-edit-view" }
latent-scan-archive = { path = "crates/latent-scan-archive" }
latent-scan-ui = { path = "crates/latent-scan-ui" }
latent-scan-detect = { path = "crates/latent-scan-detect" }

# Image handling is far too slow unoptimised; keep our own code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The pixel code is run on every slider move; unoptimised it makes the UI freeze.
[profile.dev.package.latent-image-edit]
opt-level = 3

[profile.dev.package.latent-image-edit-ui]
opt-level = 3

[profile.dev.package.latent-scan-detect]
opt-level = 3
